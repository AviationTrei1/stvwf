const SV_ROSTER = SV_ROSTER_TXT.trim().split("\n").map(l => {
  const [n, from, to, d, rep, dep, arr, blk, pf, pnf, sby] = l.trim().split(/\s+/);
  const [dd, mm] = d.split(".").map(Number);
  const mins = t => { const [h, m] = t.split(":").map(Number); return (h * 60 + m) * 6e4; };
  const base = Date.UTC(2026, mm - 1, dd);
  const repT = base + mins(rep);
  let depT = base + mins(dep); if (depT < repT) depT += 864e5;
  return { n, from, to, rep, dep, arr, blk, pf, pnf, sby: sby === "-" ? "" : sby, depT, arrT: depT + mins(blk) };
});

    const api = this.getAttribute("api");
    try {
      if (!api) {
        this.data = this.demo();
        this.ok = true;
        this.demoMode = true;
      } else {
        const r = await fetch(api, { cache: "no-store", headers: { "Accept": "application/json" } });
        if (!r.ok) throw new Error(`Worker returned HTTP ${r.status}`);
        const payload = await r.json();
        if (payload?.error) throw new Error(payload.error);
        this.data = this.normalise(payload);
        this.ok = true;
        this.demoMode = false;
        this.lastError = "";
      }
    } catch (e) {
      this.ok = false;
      this.lastError = e?.message || "Unable to reach the Worker";
      this.data = null;
      this.demoMode = false;
    }
    this.render();
  }

  render() {
    const $ = s => this.root.querySelector(s);
    const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    const hm = t => { const m = String(t || "").match(/^(\d+):(\d+)/); return m ? `${m[1].padStart(2, "0")}:${m[2]}` : "-"; };
    const dist = d => d == null ? "-" : Math.round(d).toLocaleString() + " nm";
    const z = iso => { const d = new Date(iso); return iso && !isNaN(d) ? String(d.getUTCHours()).padStart(2, "0") + String(d.getUTCMinutes()).padStart(2, "0") + "Z" : ""; };
    const rz = t => t ? t.replace(":", "") + "Z" : "";
    $(".live").className = "live " + (this.ok ? "ok" : "bad");
    $(".lt").textContent = !this.ok ? "Connection lost" : (this.demoMode ? "Demo" : "Live");
    const note = document.getElementById("connection-note");
    if (note) note.textContent = this.demoMode
      ? "Demo preview is active. Add your Cloudflare Worker /flight-map URL to enable live flight data."
      : (this.ok ? "Connected to the Cloudflare Worker. Flight data refreshes every minute." : `Worker connection failed: ${this.lastError}. Check the Worker URL, CORS settings and Worker logs.`);
    if (!this.data) { $(".body").innerHTML = `<div class="idlebox"><b>Couldn't load flight data</b><p>${esc(this.lastError || "Retrying automatically.")}</p></div>`; return; }
    const x = (this.data.flights || [])[0];
    const r = x ? SV_ROSTER.find(l => l.n === x.number) : SV_ROSTER.find(l => l.arrT > Date.now());
    let pf = r ? r.pf : (this.getAttribute("pf") || "Trei");
    let pm = r ? r.pnf : (this.getAttribute("pm") || "Adam");
    let sby = r ? r.sby : "", covering = false;
    if (r) {
      const flyer = x ? (x.flyer || svWho(x.pilot)) : null; // who is actually logged on this flight
      if (flyer && flyer !== pf) {            // someone other than the rostered PF is flying: they take the PF seat
        if (flyer === pm) pm = pf; else if (flyer === sby) sby = "";
        pf = flyer; covering = flyer === r.sby;
      } else if (!x && sby && Date.now() > r.depT + SV_NOSHOW_MIN * 6e4) { // should be airborne but isn't: standby covers
        pf = sby; sby = ""; covering = true;
      }
    }
    const crew = `<div class="crew">
          <div><span>Pilot flying${covering ? " (standby)" : ""}</span><b>${esc(pf)}</b></div>
          <div><span>Pilot monitoring</span><b>${esc(pm)}</b></div>
          ${sby ? `<div><span>Standby</span><b>${esc(sby)}</b></div>` : ""}
        </div>`;
    const blk = (label, t) => t ? `<span class="blk">${label} (sched) <strong>${t}</strong></span>` : "";
    let html;
    if (x) {
      const off = r ? rz(r.dep) : z(x.std), on = r ? rz(r.arr) : z(x.sta);
      html = `
      <div class="hero">
        <div class="top"><span class="fn">${esc(x.flight)}</span><span class="ph">${esc(x.phase || "In flight")}</span>${x.number ? `<span class="num">Flight ${esc(x.number)}</span>` : ""}</div>
        <div class="route">
          <div class="apt"><b>${esc(x.dep)}</b><span>${esc(x.depName)}</span>${blk("Off blocks", off)}</div>
          <div class="arrow" aria-hidden="true">&rarr;</div>
          <div class="apt"><b>${esc(x.arr)}</b><span>${esc(x.arrName)}</span>${blk("On blocks", on)}</div>
        </div>
        ${crew}
      </div>
      <div class="prog" role="img" aria-label="${x.pct}% of the flight complete">
        <div class="bar"><i style="width:${x.pct}%"></i></div>
        <div class="fly"><svg viewBox="0 0 24 24" style="left:${x.pct}%" aria-hidden="true"><path d="M21 16v-2l-8-5V3.5c0-.83-.67-1.5-1.5-1.5S10 2.67 10 3.5V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5l8 2.5z"/></svg></div>
      </div>
      <div class="stats">
        <div class="stat"><b>${hm(x.rem)}</b><span>ETE &middot; estimated time en route</span></div>
        <div class="stat"><b>${dist(x.dist)}</b><span>Distance remaining</span></div>
      </div>`;
    } else if (r) {
      html = `
      <div class="hero">
        <div class="top"><span class="fn">STV23T</span><span class="ph idle">Next flight</span><span class="num">Flight ${esc(r.n)}</span></div>
        <div class="route">
          <div class="apt"><b>${esc(r.from)}</b>${blk("Off blocks", rz(r.dep))}</div>
          <div class="arrow" aria-hidden="true">&rarr;</div>
          <div class="apt"><b>${esc(r.to)}</b>${blk("On blocks", rz(r.arr))}</div>
        </div>
        ${crew}
      </div>
      <div class="stats" style="margin-top:22px">
        <div class="stat"><b>${rz(r.rep)}</b><span>Report time</span></div>
        <div class="stat"><b>${hm(r.blk)}</b><span>Scheduled block time</span></div>
      </div>`;
    } else {
      html = `<div class="idlebox"><span class="ph idle">Complete</span><b style="margin-top:14px">WorldFlight 2026 is complete</b><p>Thank you for following Stevens Virtual.</p></div>`;
    }
    $(".body").innerHTML = html;
    $("footer").textContent = "Updated " + new Date(this.data.updated || Date.now()).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" }) + " \u00b7 refreshes every minute";
  }
}
customElements.define("sv-worldflight", SVWorldFlight);
